name: Property and adversarial regression tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: property-regressions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  properties:
    name: Property checks on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify generated hierarchies, corrupted input and cache properties
        run: |
          ./vendor/bin/phpunit --no-coverage \
            --display-phpunit-deprecations --fail-on-phpunit-deprecation \
            --filter 'Property|Mutation|Churn|Budget|Fingerprint|CacheBound'
