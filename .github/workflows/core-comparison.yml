name: Compare stable core lookup baselines

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stable base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: baseline
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Compare source-identical query workloads
        run: |
          set -euo pipefail
          mkdir -p build/compare
          for scenario in district_id village_id village_name district_children village_children village_ancestors; do
            php candidate/tools/benchmarks/query-scenario.php baseline "$scenario" 1000 > "build/compare/base-$scenario.json"
            php candidate/tools/benchmarks/query-scenario.php candidate "$scenario" 1000 > "build/compare/head-$scenario.json"
            base=$(php -r 'echo json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR)["fingerprint"];' "build/compare/base-$scenario.json")
            head=$(php -r 'echo json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR)["fingerprint"];' "build/compare/head-$scenario.json")
            if [ "$base" != "$head" ]; then
              echo "::error::Incompatible lookup results in $scenario"
              exit 1
            fi
            php -r '$b=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$h=json_decode(file_get_contents($argv[2]),true,512,JSON_THROW_ON_ERROR);printf("%s: identical IDs | first query %.2f -> %.2f us | warm mean %.3f -> %.3f us | peak %.1f -> %.1f MiB\\n",$b["scenario"],$b["first_query_us"],$h["first_query_us"],$b["warm_mean_us"],$h["warm_mean_us"],$b["memory_peak_bytes"]/1048576,$h["memory_peak_bytes"]/1048576);' "build/compare/base-$scenario.json" "build/compare/head-$scenario.json"
          done
      - name: Publish source-comparable performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: core-comparison-php84
          path: build/compare/*.json
          retention-days: 14
