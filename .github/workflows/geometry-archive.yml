name: Geometry review archive

on:
  pull_request:
    branches: [main, next/2.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, json
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify archived artifact contract
        run: ./vendor/bin/phpunit --filter GeometryArchiveTest
