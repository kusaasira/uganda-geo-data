name: Consumer installation

on:
  pull_request:
    branches: [main, next/2.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Composer consumer / PHP ${{ matrix.php }} / ${{ matrix.consumer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        consumer: [standalone, laravel]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Verify independent installation
        run: php tools/ci/consumer-install.php ${{ matrix.consumer == 'laravel' && '--laravel' || '' }}
