name: Release security and SBOM

on:
  pull_request:
    branches: [main, next/2.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate deterministic CycloneDX inventory
        run: |
          mkdir -p build
          version=$(php -r '
            $manifest=json_decode(file_get_contents("resources/releases/v2.0.1-notes.json"),true,512,JSON_THROW_ON_ERROR);
            $base=$manifest["base_version"] ?? null;
            if (!is_string($base) || !preg_match("/^v[0-9]+\\.[0-9]+\\.[0-9]+$/D",$base)) {
                fwrite(STDERR,"Invalid source release version\\n");
                exit(1);
            }
            echo substr($base,1)."-dev";
          ')
          php tools/release/create-sbom.php "$version" build/sbom.json
          SBOM_VERSION="$version" php -r '
            $d=json_decode(file_get_contents("build/sbom.json"),true,512,JSON_THROW_ON_ERROR);
            if (($d["bomFormat"]??null)!=="CycloneDX"
                || ($d["metadata"]["component"]["version"]??null)!==getenv("SBOM_VERSION")
                || ($d["metadata"]["component"]["name"]??null)!=="kusaasira/uganda-geo") {
                fwrite(STDERR,"SBOM package identity/version mismatch\\n");
                exit(1);
            }
          '
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-geo-runtime-sbom
          path: build/sbom.json
          retention-days: 7
