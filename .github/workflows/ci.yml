name: CI

on:
  push:
    branches:
      - main
      - next/2.x
  pull_request:
    branches:
      - main
      - next/2.x
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        dependencies: ['highest']
        include:
          - php: '8.2'
            dependencies: 'lowest'
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          tools: composer:v2
          coverage: none

      - name: Validate package metadata
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --no-interaction --prefer-dist --prefer-lowest
          else
            composer install --no-interaction --prefer-dist
          fi

      - name: Unit and regression tests
        run: ./vendor/bin/phpunit --no-coverage

      - name: Coding standards
        run: ./vendor/bin/ecs check src tests

      - name: Static analysis
        run: ./vendor/bin/phpstan analyse src --level 9

      - name: Standalone package smoke test
        run: php tools/ci/smoke.php

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Audit production dependencies
        run: composer audit --no-dev
